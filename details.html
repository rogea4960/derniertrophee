<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Depuis Quand Ce Club N'a Plus Gagné De Trophée ??</title>
</head>
<body id="detail-body">
    <canvas id="fireworks-canvas"></canvas>

    <header class="dark-header">
        <div class="logo-area">
            <a href="index.html">
                <img src="img/last-won-a-trophy.png" alt="Logo">
            </a>
        </div>
    </header>

    <main class="detail-content">
        <h1 id="title-text">Chargement...</h1>
        
        <div class="logo-container">
            <img id="club-logo" src="" alt="Logo Club">
        </div>

        <div id="congrats-message"></div>

        <div class="timer-display" id="timer-container">
            <div class="time-card">
                <span id="y">0</span>
                <p>Ans</p>
            </div>
            <div class="time-card">
                <span id="d" class="red-text">0</span>
                <p>Jours</p>
            </div>
            <div class="time-card">
                <span id="h">0</span>
                <p>Heures</p>
            </div>
            <div class="time-card">
                <span id="m">0</span>
                <p>Minutes</p>
            </div>
            <div class="time-card">
                <span id="s">0</span>
                <p>Secondes</p>
            </div>
        </div>

        <p id="desc" class="desc-text"></p>
      
        <a href="index.html" class="back-link">← Retour à la liste</a>
    </main>

    <script src="script.js"></script>
</body>
</html>
